<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Now Playing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;700&display=swap">
<style>
@property --c1{syntax:'<color>';inherits:true;initial-value:#2a1d3a}
@property --c2{syntax:'<color>';inherits:true;initial-value:#8f3f45}
@property --c3{syntax:'<color>';inherits:true;initial-value:#e08a4a}
:root{--c1:#2a1d3a;--c2:#8f3f45;--c3:#e08a4a;--fade:10s}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;overflow:hidden}
body{display:flex;align-items:center;justify-content:center;font-family:'Figtree',system-ui,sans-serif;color:#fff;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#stage{width:900px;height:416px;flex:none;position:relative;overflow:hidden;background:linear-gradient(160deg,var(--c1) 0%,var(--c2) 60%,var(--c3) 100%);color:#fff;transition:--c1 var(--fade) ease-in-out,--c2 var(--fade) ease-in-out,--c3 var(--fade) ease-in-out;transform-origin:center center}
#glow{position:absolute;left:-60px;top:-80px;width:400px;height:400px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.22),rgba(255,255,255,0) 70%)}
#vinyl{position:absolute;right:-92px;top:-14px;width:508px;height:508px;filter:drop-shadow(0 20px 40px rgba(0,0,0,.45))}
#disc{position:absolute;inset:0;border-radius:50%;background:repeating-radial-gradient(circle at center,#0d0d0d 0 2px,#1c1c1c 2px 4px);display:flex;align-items:center;justify-content:center;animation:spin 28s linear infinite}
.paused #disc{animation-play-state:paused}
#label{position:relative;width:260px;height:260px;border-radius:50%;background:linear-gradient(135deg,var(--c1),var(--c2) 55%,var(--c3)) center/cover no-repeat}
#label::after{content:"";position:absolute;left:50%;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:#111}
#shine{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 20deg,rgba(255,255,255,0) 0deg,rgba(255,255,255,.16) 30deg,rgba(255,255,255,0) 70deg,rgba(255,255,255,0) 180deg,rgba(255,255,255,.1) 210deg,rgba(255,255,255,0) 250deg)}
#panel{position:absolute;left:47px;top:48px;bottom:48px;width:420px;padding:32px 36px;border-radius:32px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.35);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);display:flex;flex-direction:column;justify-content:space-between}
#time{font-size:112px;font-weight:700;line-height:1;letter-spacing:-4px}
#date{font-size:17px;font-weight:500;opacity:.85;margin-top:4px}
#title{font-size:26px;font-weight:700;line-height:1.25;white-space:nowrap;overflow:hidden;-webkit-mask-image:linear-gradient(90deg,#000 94%,transparent);mask-image:linear-gradient(90deg,#000 94%,transparent)}
#title.fits{-webkit-mask-image:none;mask-image:none}
#tin{display:inline-block;will-change:transform}
#title.scroll #tin{animation:slide var(--dur,8s) ease-in-out infinite alternate}
@keyframes slide{0%,15%{transform:translateX(0)}85%,100%{transform:translateX(var(--dx))}}
#artist{font-size:16px;opacity:.8;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#track{margin-top:14px}
#bar{height:4px;border-radius:2px;background:rgba(255,255,255,.3);position:relative}
#fill{position:absolute;left:0;top:0;height:4px;width:0;border-radius:2px;background:#fff;transition:width .5s linear}
#times{display:flex;justify-content:space-between;align-items:center;font-size:12px;margin-top:4px}
#times span{opacity:.8;min-width:34px}
#times span:last-child{text-align:right}
#ctrl{display:flex;align-items:center;gap:10px}
#ctrl button{border:0;padding:0;border-radius:50%;background:rgba(255,255,255,.18);color:#fff;display:flex;align-items:center;justify-content:center;width:34px;height:34px;-webkit-tap-highlight-color:transparent}
#ctrl button:active{background:rgba(255,255,255,.35)}
#ctrl #pp{width:40px;height:40px;background:#fff;color:#1a1020}
#ctrl svg{width:18px;height:18px;fill:currentColor}
#pp svg{width:20px;height:20px}
#pp .ic-play{display:none}
.is-paused #pp .ic-play{display:block}
.is-paused #pp .ic-pause{display:none}
#login{color:#fff;position:absolute;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center}
#login[hidden]{display:none}
#loginbox{width:420px;padding:28px 32px;border-radius:28px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);display:flex;flex-direction:column;gap:14px;text-align:center}
#loginbox h1{margin:0;font-size:24px}
#loginbox p{margin:0;font-size:14px;opacity:.85}
#cid{width:100%;padding:12px 14px;border-radius:12px;border:1px solid rgba(255,255,255,.4);background:rgba(0,0,0,.25);color:#fff;font:inherit;font-size:14px}
#cid[hidden]{display:none}
#go{padding:14px 18px;border:0;border-radius:999px;background:#fff;color:#111;font:inherit;font-weight:700;font-size:16px;min-height:48px}
#err{position:absolute;left:24px;bottom:14px;font-size:12px;opacity:0;transition:opacity .4s;background:rgba(0,0,0,.5);padding:6px 12px;border-radius:999px}
#err.on{opacity:1}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="stage">
<div id="glow"></div>
<div id="vinyl"><div id="disc"><div id="label"></div></div><div id="shine"></div></div>
<div id="panel">
<div>
<div id="time">--:--</div>
<div id="date"></div>
</div>
<div id="track">
<div id="title"><span id="tin">Rien en lecture</span></div>
<div id="artist">Lance un morceau sur Spotify</div>
<div style="margin-top:14px">
<div id="bar"><div id="fill"></div></div>
<div id="times"><span id="cur">0:00</span>
<div id="ctrl">
<button id="prev" aria-label="Précédent"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9.5 12z"/></svg></button>
<button id="pp" aria-label="Lecture / pause"><svg class="ic-pause" viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg><svg class="ic-play" viewBox="0 0 24 24"><path d="M7 4.5v15L20 12z"/></svg></button>
<button id="next" aria-label="Suivant"><svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5v14l10.5-7z"/></svg></button>
</div>
<span id="dur">0:00</span></div>
</div>
</div>
</div>
<div id="err"></div>
<div id="login" hidden>
<div id="loginbox">
<h1>Now Playing</h1>
<p>Connecte ton compte Spotify pour afficher le morceau en cours.</p>
<input id="cid" type="text" placeholder="Client ID Spotify" autocomplete="off" autocapitalize="off" spellcheck="false" hidden>
<button id="go" type="button">Se connecter à Spotify</button>
</div>
</div>
</div>
<script>
(() => {
const CLIENT_ID_CONST = 'COLLE_TON_CLIENT_ID_ICI';
const SCOPE = 'user-read-currently-playing user-modify-playback-state';
const LS = window.localStorage;
const $ = id => document.getElementById(id);
const stage = $('stage');
const root = document.documentElement;
const DEFAULT_COLORS = ['#2a1d3a', '#8f3f45', '#e08a4a'];
const view = { dx: 0, dy: 0 };
const base = { progress: 0, t: 0, playing: false, duration: 1 };
let current = null;
let wakeLock = null;
let errTimer = null;

function fit() {
  const s = Math.min(innerWidth / 900, innerHeight / 416);
  stage.style.transform = 'translate(' + view.dx + 'px,' + view.dy + 'px) scale(' + s + ')';
}

function clientId() {
  return CLIENT_ID_CONST !== 'COLLE_TON_CLIENT_ID_ICI' ? CLIENT_ID_CONST : (LS.getItem('np_client_id') || '');
}

const redirectUri = location.origin + location.pathname;

function b64url(bytes) {
  return btoa(String.fromCharCode.apply(null, bytes)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}

function rand(n) {
  const a = new Uint8Array(n);
  crypto.getRandomValues(a);
  return b64url(a);
}

async function challenge(v) {
  const d = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(v));
  return b64url(new Uint8Array(d));
}

function showErr(msg) {
  const e = $('err');
  e.textContent = msg;
  e.classList.add('on');
  clearTimeout(errTimer);
  errTimer = setTimeout(() => e.classList.remove('on'), 5000);
}

function showLogin() {
  $('login').hidden = false;
  $('cid').hidden = CLIENT_ID_CONST !== 'COLLE_TON_CLIENT_ID_ICI';
  if (!$('cid').hidden) $('cid').value = LS.getItem('np_client_id') || '';
}

async function login() {
  if (!$('cid').hidden) {
    const v = $('cid').value.trim();
    if (!v) { showErr('Colle ton Client ID Spotify'); return; }
    LS.setItem('np_client_id', v);
  }
  LS.setItem('np_scope', SCOPE);
  const verifier = rand(64);
  LS.setItem('np_verifier', verifier);
  const params = new URLSearchParams({
    client_id: clientId(),
    response_type: 'code',
    redirect_uri: redirectUri,
    code_challenge_method: 'S256',
    code_challenge: await challenge(verifier),
    scope: SCOPE
  });
  location.href = 'https://accounts.spotify.com/authorize?' + params.toString();
}

function saveTokens(j) {
  LS.setItem('np_token', j.access_token);
  if (j.refresh_token) LS.setItem('np_refresh', j.refresh_token);
  LS.setItem('np_exp', String(Date.now() + j.expires_in * 1000));
}

async function tokenRequest(body) {
  const r = await fetch('https://accounts.spotify.com/api/token', {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: new URLSearchParams(body)
  });
  if (!r.ok) return null;
  const j = await r.json();
  saveTokens(j);
  return j;
}

async function exchange(code) {
  return tokenRequest({
    client_id: clientId(),
    grant_type: 'authorization_code',
    code: code,
    redirect_uri: redirectUri,
    code_verifier: LS.getItem('np_verifier') || ''
  });
}

async function refresh() {
  const rt = LS.getItem('np_refresh');
  if (!rt) return false;
  const j = await tokenRequest({ client_id: clientId(), grant_type: 'refresh_token', refresh_token: rt });
  return !!j;
}

function logout() {
  LS.removeItem('np_token');
  LS.removeItem('np_refresh');
  LS.removeItem('np_exp');
  showLogin();
}

async function getToken() {
  if (!LS.getItem('np_token')) return null;
  if (Date.now() > Number(LS.getItem('np_exp') || 0) - 60000) {
    if (!(await refresh())) return null;
  }
  return LS.getItem('np_token');
}

function setColors(c) {
  root.style.setProperty('--c1', c[0]);
  root.style.setProperty('--c2', c[1]);
  root.style.setProperty('--c3', c[2]);
}

function extractColors(url) {
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      try {
        const c = document.createElement('canvas');
        c.width = 8;
        c.height = 8;
        const x = c.getContext('2d');
        x.drawImage(img, 0, 0, 8, 8);
        const pick = (i, j, k) => {
          const d = x.getImageData(i, j, 1, 1).data;
          const f = v => Math.max(0, Math.min(255, Math.round(v * k)));
          return 'rgb(' + f(d[0]) + ',' + f(d[1]) + ',' + f(d[2]) + ')';
        };
        resolve([pick(1, 1, 0.35), pick(4, 4, 0.8), pick(6, 6, 1.1)]);
      } catch (e) {
        showErr('Couleurs : ' + e.message);
        resolve(null);
      }
    };
    img.onerror = () => { showErr('Couleurs : image illisible'); resolve(null); };
    fetch(url, { mode: 'cors', cache: 'no-store' })
      .then(r => r.blob())
      .then(bl => { img.src = URL.createObjectURL(bl); })
      .catch(e => { showErr('Couleurs : ' + e.message); resolve(null); });
  });
}

function setTitle(text) {
  const t = $('title'), i = $('tin');
  i.textContent = text;
  t.classList.remove('scroll', 'fits');
  t.style.fontSize = '26px';
  const w = t.clientWidth;
  let fs = 26;
  while (i.scrollWidth > w && fs > 19) { fs -= 1; t.style.fontSize = fs + 'px'; }
  const over = i.scrollWidth - w;
  if (over > 0) {
    t.style.setProperty('--dx', -(over + 8) + 'px');
    t.style.setProperty('--dur', Math.max(5, over / 25 + 3) + 's');
    t.classList.add('scroll');
  } else {
    t.classList.add('fits');
  }
}

async function setTrack(id, name, artist, url) {
  setTitle(name);
  $('artist').textContent = artist;
  if (!url) {
    $('label').style.backgroundImage = '';
    setColors(DEFAULT_COLORS);
    return;
  }
  $('label').style.backgroundImage = 'url("' + url + '")';
  const colors = await extractColors(url);
  if (current === id) setColors(colors || DEFAULT_COLORS);
}

function setIdle() {
  current = null;
  base.playing = false;
  base.progress = 0;
  base.duration = 1;
  setTitle('Rien en lecture');
  $('artist').textContent = 'Lance un morceau sur Spotify';
  $('label').style.backgroundImage = '';
  setColors(DEFAULT_COLORS);
  stage.classList.add('paused');
  stage.classList.add('is-paused');
}

function apply(d) {
  const it = d.item;
  if (!it) { setIdle(); return; }
  const id = it.id || it.uri || it.name;
  const name = it.name || '';
  const artist = it.artists ? it.artists.map(a => a.name).join(', ') : ((it.show && it.show.publisher) || '');
  const imgs = (it.album && it.album.images) || it.images || [];
  base.progress = d.progress_ms || 0;
  base.t = performance.now();
  base.playing = !!d.is_playing;
  base.duration = it.duration_ms || 1;
  stage.classList.toggle('paused', !base.playing);
  stage.classList.toggle('is-paused', !base.playing);
  if (id !== current) {
    current = id;
    setTrack(id, name, artist, imgs[0] ? imgs[0].url : '');
  }
}

async function poll() {
  const tk = await getToken();
  if (!tk) { showLogin(); return 5000; }
  try {
    const r = await fetch('https://api.spotify.com/v1/me/player/currently-playing?additional_types=episode', {
      headers: { Authorization: 'Bearer ' + tk }
    });
    if (r.status === 204) { setIdle(); return 4000; }
    if (r.status === 401) {
      if (await refresh()) return 500;
      logout();
      return 5000;
    }
    if (r.status === 429) {
      showErr('Spotify demande de ralentir');
      return ((Number(r.headers.get('Retry-After')) || 10) + 1) * 1000;
    }
    if (r.ok) { apply(await r.json()); return 4000; }
    showErr('Erreur Spotify ' + r.status);
    return 8000;
  } catch (e) {
    showErr('Connexion perdue');
    return 8000;
  }
}

async function control(method, path) {
  const tk = await getToken();
  if (!tk) { showLogin(); return; }
  try {
    const r = await fetch('https://api.spotify.com/v1/me/player/' + path, {
      method: method,
      headers: { Authorization: 'Bearer ' + tk }
    });
    if (r.status === 401 || r.status === 403) {
      showErr('Droits manquants, reconnexion');
      logout();
    } else if (r.status === 404) {
      showErr('Aucun appareil Spotify actif');
    } else if (r.status === 429) {
      showErr('Spotify demande de ralentir');
    } else if (!r.ok) {
      showErr('Erreur Spotify ' + r.status);
    }
  } catch (e) {
    showErr('Connexion perdue');
  }
  setTimeout(() => { poll().catch(() => {}); }, 700);
}

function bindControls() {
  $('pp').addEventListener('click', () => {
    const play = !base.playing;
    base.progress = Math.min(base.duration, base.progress + (base.playing ? performance.now() - base.t : 0));
    base.t = performance.now();
    base.playing = play;
    stage.classList.toggle('paused', !play);
    stage.classList.toggle('is-paused', !play);
    control('PUT', play ? 'play' : 'pause');
  });
  $('next').addEventListener('click', () => control('POST', 'next'));
  $('prev').addEventListener('click', () => control('POST', 'previous'));
}

async function loop() {
  let wait = 4000;
  try { wait = await poll(); } catch (e) { wait = 8000; }
  setTimeout(loop, wait);
}

function fmt(ms) {
  const s = Math.max(0, Math.floor(ms / 1000));
  return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
}

function tickProgress() {
  const cur = Math.min(base.duration, base.progress + (base.playing ? performance.now() - base.t : 0));
  $('fill').style.width = (cur / base.duration * 100).toFixed(2) + '%';
  $('cur').textContent = fmt(cur);
  $('dur').textContent = current ? fmt(base.duration) : '0:00';
}

const timeFmt = new Intl.DateTimeFormat('fr-FR', { hour: '2-digit', minute: '2-digit', hourCycle: 'h23' });
const dateFmt = new Intl.DateTimeFormat('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });

function tickClock() {
  const now = new Date();
  $('time').textContent = timeFmt.format(now);
  const d = dateFmt.format(now);
  $('date').textContent = d.charAt(0).toUpperCase() + d.slice(1);
}

async function lockScreen() {
  try {
    if (!('wakeLock' in navigator) || wakeLock) return;
    wakeLock = await navigator.wakeLock.request('screen');
    wakeLock.addEventListener('release', () => { wakeLock = null; });
  } catch (e) {
    wakeLock = null;
  }
}

function goFullscreen() {
  if (document.fullscreenElement || !root.requestFullscreen) return;
  root.requestFullscreen().then(() => {
    if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(() => {});
  }).catch(() => {});
}

function shiftPixels() {
  view.dx = Math.round(Math.random() * 12 - 6);
  view.dy = Math.round(Math.random() * 12 - 6);
  fit();
}

async function init() {
  fit();
  tickClock();
  tickProgress();
  addEventListener('resize', fit);
  setInterval(tickClock, 1000);
  setInterval(tickProgress, 500);
  setInterval(shiftPixels, 60000);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') lockScreen(); });
  document.addEventListener('click', () => { goFullscreen(); lockScreen(); });
  $('go').addEventListener('click', login);
  bindControls();
  if (LS.getItem('np_scope') !== SCOPE) {
    LS.removeItem('np_token');
    LS.removeItem('np_refresh');
    LS.removeItem('np_exp');
  }
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});

  const params = new URLSearchParams(location.search);
  if (params.get('error')) showErr('Connexion refusée : ' + params.get('error'));
  if (params.get('code')) {
    const ok = await exchange(params.get('code'));
    if (!ok) showErr('Échec de la connexion Spotify');
  }
  if (params.get('code') || params.get('error')) history.replaceState(null, '', location.pathname);

  lockScreen();
  if (LS.getItem('np_token') && clientId()) {
    loop();
  } else {
    showLogin();
  }
}

init();
})();
</script>
</body>
</html>
